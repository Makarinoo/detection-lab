title: DCSync - réplication AD demandée par un compte non-DC
id: 9743763a-49f8-4db3-9ef5-c9c94c7fa09d
status: experimental
description: Détecte une demande de réplication des secrets AD (DS-Replication-Get-Changes-All) par un compte qui n'est pas un contrôleur de domaine.
references:
    - https://attack.mitre.org/techniques/T1003/006/
author: Makarin0
date: 2026-11-06
tags:
    - attack.credential_access
    - attack.t1003.006
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID : 4662
        Properties|contains : 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2
    filter:
        SubjectUserName|endswith : $
    condition: selection and not filter
falsepositives:
    - Azure AD Connect (compte de synchronisation)
level: high
